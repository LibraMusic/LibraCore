name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true

      - name: Install Just
        uses: extractions/setup-just@v3

      - name: Install dependencies
        run: just deps

      - name: Build
        run: just build

      - name: Run unit tests
        run: just test-unit

      - name: Run integration tests
        run: just test-integration
